<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2c3a31">
  <title>Lacak Pesanan — RuangRupa</title><link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--ink:#202822;--forest:#2c3a31;--cream:#f6f2e9;--paper:#fffdf8;--gold:#d9a84e;--rust:#a8552f;--line:#ded9cf;--muted:#6f756f;--green:#39704c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.nav{height:74px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 980px)/2))}.brand{font:700 1.5rem Georgia,serif}.brand span{color:var(--rust)}a{color:inherit;text-decoration:none}.page{width:min(980px,calc(100% - 30px));margin:38px auto}.head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:24px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(2rem,5vw,3rem);margin:0}.muted{color:var(--muted)}.refresh{border:1px solid var(--forest);background:white;color:var(--forest);border-radius:999px;padding:10px 16px;font-weight:700}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}.status-card{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status-box{padding:16px;border-radius:14px;background:#f3f0e9}.status-box small{display:block;color:var(--muted);margin-bottom:4px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#efe3ca;color:#785326;font-size:.78rem;font-weight:750}.pill.good{background:#e4efe7;color:#376446}.timeline{display:grid;gap:0;margin-top:20px}.step{display:grid;grid-template-columns:24px 1fr;gap:12px;min-height:72px}.marker{display:flex;flex-direction:column;align-items:center}.dot{width:13px;height:13px;border-radius:50%;background:#d8d3ca;border:3px solid white;box-shadow:0 0 0 1px #c9c2b6}.step.done .dot{background:var(--green)}.line{width:2px;background:#ddd7cc;flex:1}.step:last-child .line{display:none}.step strong,.step small{display:block}.step small{color:var(--muted);margin-top:3px}.items{display:grid;gap:0}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item small{display:block;color:var(--muted)}.totals{margin-top:14px}.total-row{display:flex;justify-content:space-between;padding:6px 0}.grand{border-top:1px solid var(--line);padding-top:12px;margin-top:5px;font-size:1.08rem}.tracking{margin-top:18px;padding:15px;border:1px dashed #c8a66b;border-radius:13px;background:#fff9ec}.empty{text-align:center;padding:70px 24px;background:var(--paper);border:1px dashed var(--line);border-radius:20px}.empty a{display:inline-block;margin-top:16px;color:var(--rust);font-weight:700}@media(max-width:720px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.status-card{grid-template-columns:1fr}.card{padding:20px}}
  </style>
</head>
