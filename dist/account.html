<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2c3a31"><title>Akun Saya — RuangRupa</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--ink:#202822;--forest:#2c3a31;--cream:#f6f2e9;--paper:#fffdf8;--rust:#a8552f;--line:#ded9cf;--muted:#6f756f}*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:var(--ink);font:16px/1.55 system-ui,sans-serif}.nav{height:74px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1080px)/2))}.brand{font:700 1.5rem Georgia,serif}.brand span{color:var(--rust)}a{color:inherit;text-decoration:none}.page{width:min(1080px,calc(100% - 32px));margin:36px auto}.notice{border:1px dashed #c7aa79;background:#fff9ec;color:#795a2d;border-radius:14px;padding:13px 16px;margin-bottom:18px}.auth{width:min(520px,100%);margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px}.auth h1,.heading h1{font:500 2.4rem Georgia,serif;margin:0 0 8px}.meta{color:var(--muted)}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:.86rem;font-weight:700}.field input,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px;background:white;font:inherit}.field textarea{min-height:78px}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--forest);color:white;font-weight:700;cursor:pointer}.auth .btn{width:100%;margin-top:20px}.dashboard{display:grid;grid-template-columns:240px 1fr;gap:20px}.side,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px}.side{padding:18px;height:max-content}.avatar{width:58px;height:58px;border-radius:50%;background:var(--forest);color:white;display:grid;place-items:center;font:600 1.35rem Georgia,serif}.side h2{font:600 1.2rem Georgia,serif;margin:12px 0 2px}.menu{display:grid;gap:6px;margin-top:24px}.menu button{border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;cursor:pointer}.menu button.active{background:var(--cream);font-weight:700}.content{display:grid;gap:18px}.card{padding:24px}.card h2{font:500 1.5rem Georgia,serif;margin:0 0 15px}.profile-grid,.address-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.address-list,.order-list{display:grid;gap:12px;margin-top:18px}.address,.order{padding:16px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr auto;gap:12px}.address p,.order p{margin:2px 0}.small-btn{border:1px solid var(--forest);background:white;color:var(--forest);border-radius:9px;padding:8px 11px;cursor:pointer;height:max-content}.danger{border-color:var(--rust);color:var(--rust)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#efe3ca;color:#785326;font-size:.74rem;font-weight:700}.pill.paid{background:#e4efe7;color:#376446}.pill.failed{background:#f3dfda;color:#984528}.empty{border:1px dashed var(--line);border-radius:14px;text-align:center;padding:34px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){.dashboard{grid-template-columns:1fr}.profile-grid,.address-grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:auto 1fr;gap:0 14px}.menu{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}.menu button{text-align:center}}</style></head><body><header class="nav"><a class="brand" href="index.html">Ruang<span>Rupa</span></a><a href="index.html">Kembali ke katalog</a></header><main class="page"><div class="notice">Akun demo disimpan hanya di browser ini. Jangan gunakan data pribadi sebenarnya.</div><section class="auth" id="authView"><h1>Buat akun demo</h1><p class="meta">Profil lokal untuk mencoba pengalaman pelanggan.</p><form id="authForm"><div class="field"><label for="authName">Nama</label><input id="authName" required placeholder="Nama demo"></div><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" required placeholder="demo@contoh.com"></div><div class="field"><label for="authPhone">Nomor telepon</label><input id="authPhone" required placeholder="08xxxxxxxxxx"></div><button class="btn" type="submit">Masuk ke akun demo</button></form></section><section class="dashboard" id="dashboard" hidden><aside class="side"><div class="avatar" id="avatar">RR</div><div><h2 id="sideName"></h2><small class="meta" id="sideEmail"></small></div><nav class="menu"><button class="active" data-tab="profile">Profil</button><button data-tab="addresses">Alamat</button><button data-tab="orders">Pesanan</button></nav><button class="small-btn danger" id="logout" style="margin-top:18px">Keluar dari demo</button></aside><div class="content"><section class="card tab" id="tab-profile"><h2>Profil pelanggan</h2><form id="profileForm"><div class="profile-grid"><div class="field"><label for="profileName">Nama</label><input id="profileName" required></div><div class="field"><label for="profileEmail">Email</label><input id="profileEmail" type="email" required></div><div class="field"><label for="profilePhone">Telepon</label><input id="profilePhone" required></div></div><button class="btn" type="submit" style="margin-top:18px">Simpan profil</button></form></section><section class="card tab" id="tab-addresses" hidden><h2>Alamat tersimpan</h2><form id="addressForm"><div class="address-grid"><div class="field"><label for="addressLabel">Label</label><input id="addressLabel" required placeholder="Rumah"></div><div class="field"><label for="addressCity">Kota</label><input id="addressCity" required></div><div class="field" style="grid-column:1/-1"><label for="addressText">Alamat lengkap</label><textarea id="addressText" required></textarea></div></div><button class="btn" type="submit" style="margin-top:16px">Tambah alamat</button></form><div class="address-list" id="addressList"></div></section><section class="card tab" id="tab-orders" hidden><h2>Riwayat pesanan</h2><div class="order-list" id="orderList"></div></section></div></section></main><script src="account.js"></script><script>if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js')</script></body></html>
