<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2c3a31"><title>Riwayat Pesanan — RuangRupa</title><style>:root{--ink:#202822;--forest:#2c3a31;--cream:#f6f2e9;--paper:#fffdf8;--rust:#a8552f;--line:#ded9cf;--muted:#6f756f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.nav{height:74px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 900px)/2))}.brand{font:700 1.5rem Georgia,serif}.brand span{color:var(--rust)}a{color:inherit;text-decoration:none}.page{width:min(900px,calc(100% - 32px));margin:42px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font:500 2.5rem Georgia,serif;margin:0}.meta{color:var(--muted)}.list{display:grid;gap:14px;margin-top:26px}.order{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:14px}.order h2{font:600 1.2rem Georgia,serif;margin:0 0 5px}.order p{margin:3px 0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#efe3ca;color:#785326;font-size:.74rem;font-weight:700}.pill.paid{background:#e4efe7;color:#376446}.pill.failed{background:#f3dfda;color:#984528}.btn{display:inline-block;padding:9px 13px;border:1px solid var(--forest);border-radius:10px;color:var(--forest);font-weight:700}.empty{text-align:center;background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:50px;color:var(--muted)}@media(max-width:600px){.order{grid-template-columns:1fr}.head{display:block}}</style></head><body><header class="nav"><a class="brand" href="index.html">Ruang<span>Rupa</span></a><a href="index.html">Kembali ke katalog</a></header><main class="page"><div class="head"><div><h1>Riwayat pesanan</h1><p class="meta">Pesanan simulasi yang tersimpan di perangkat ini.</p></div></div><div class="list" id="list"></div></main><script>const rupiah=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v),orders=JSON.parse(localStorage.getItem('ruangrupa-orders')||'[]'),list=document.querySelector('#list');list.innerHTML=orders.length?orders.map(o=>`<article class="order"><div><span class="pill ${o.status}">${o.status==='paid'?'Berhasil':o.status==='failed'?'Gagal':'Menunggu'}</span><h2>${o.id}</h2><p>${new Date(o.createdAt).toLocaleString('id-ID')} · ${o.items.reduce((s,i)=>s+i.qty,0)} barang</p><p><strong>${rupiah(o.total)}</strong> · ${o.method}</p></div><div><a class="btn" href="payment.html?order=${encodeURIComponent(o.id)}">Lihat pembayaran</a></div></article>`).join(''):'<div class="empty"><strong>Belum ada pesanan.</strong><br>Buat checkout simulasi dari katalog.</div>';</script></body></html>
